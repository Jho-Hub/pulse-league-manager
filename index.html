<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse League Manager Online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:20px;margin:0}main{max-width:1300px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.kpi{font-size:28px;font-weight:800}.muted{color:#6b7280;font-size:13px}nav{display:flex;gap:6px;overflow:auto;background:#fff;border-bottom:1px solid #ddd;padding:9px 18px}nav button{border:0;background:transparent;padding:9px 12px;border-radius:7px}nav button.active{background:#dbeafe;color:#1d4ed8;font-weight:700}button{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:9px 12px;font-weight:600;cursor:pointer}button.secondary{background:#e5e7eb;color:#111827}input,select{padding:8px;border:1px solid #d1d5db;border-radius:7px;width:100%;box-sizing:border-box}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.field label{font-size:12px;color:#6b7280;display:block;margin-bottom:4px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;font-size:13px}th{background:#f8fafc}.view{display:none}.view.active{display:block}.error{color:#b91c1c;margin-top:8px}@media(max-width:800px){.grid,.row{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid,.row{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><h1>Pulse League Manager</h1><div id="user" class="muted" style="color:#cbd5e1">Online</div></div><button id="logout" class="secondary" style="display:none">Sign out</button></header>
<div id="login" style="max-width:430px;margin:70px auto;padding:20px"><div class="card"><h2>League Staff Login</h2><p class="muted">Sign in to access the shared league database.</p><div class="field"><label>Email</label><input id="email" type="email"></div><br><div class="field"><label>Password</label><input id="password" type="password"></div><br><button id="signin">Sign in</button><button id="signup" class="secondary" style="margin-left:8px">Create account</button><div id="authmsg" class="error"></div></div></div>
<div id="app" style="display:none"><nav id="nav"></nav><main>
<section id="dashboard" class="view active"></section><section id="players" class="view"></section><section id="teams" class="view"></section><section id="games" class="view"></section><section id="standings" class="view"></section><section id="payments" class="view"></section>
</main></div>
<script src="config.js"></script>
<script>
const client=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const tabs=[["dashboard","Dashboard"],["players","Players"],["teams","Teams"],["games","Schedule"],["standings","Standings"],["payments","Payments"]];
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let cache={players:[],teams:[],games:[],payments:[]};
const q=async table=>{const r=await client.from(table).select("*").order("created_at",{ascending:true});if(r.error)throw r.error;return r.data||[]};
async function load(){cache.players=await q("players");cache.teams=await q("teams");cache.games=await q("games");cache.payments=await q("payments");render()}
function renderNav(){nav.innerHTML=tabs.map((x,i)=>`<button class="${i===0?"active":""}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join("")}
function show(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active")}
function render(){renderNav();dashboard.innerHTML=`<h2>Dashboard</h2><div class=grid><div class=card><div class=muted>Players</div><div class=kpi>${cache.players.length}</div></div><div class=card><div class=muted>Teams</div><div class=kpi>${cache.teams.length}</div></div><div class=card><div class=muted>Games</div><div class=kpi>${cache.games.length}</div></div><div class=card><div class=muted>Collected</div><div class=kpi>$${cache.payments.reduce((a,x)=>a+Number(x.amount_paid||0),0).toFixed(2)}</div></div></div>`;
players.innerHTML=`<h2>Players</h2><div class=card><button onclick="addPlayer()">Add Player</button><div class=tablewrap><table><thead><tr><th>Name</th><th>Division</th><th>Team</th><th>Jersey</th><th>Fee</th><th>Paid</th></tr></thead><tbody>${cache.players.map(p=>`<tr><td>${esc(p.first_name)} ${esc(p.last_name)}</td><td>${esc(p.division)}</td><td>${esc(p.team)}</td><td>${esc(p.jersey)}</td><td>$${Number(p.registration_fee||0).toFixed(2)}</td><td>$${Number(p.paid||0).toFixed(2)}</td></tr>`).join("")}</tbody></table></div></div>`;
teams.innerHTML=`<h2>Teams</h2><div class=card><button onclick="addTeam()">Add Team</button><div class=tablewrap><table><thead><tr><th>Team</th><th>Division</th><th>Coach</th><th>Players</th></tr></thead><tbody>${cache.teams.map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.division)}</td><td>${esc(t.coach)}</td><td>${cache.players.filter(p=>p.team===t.name).length}</td></tr>`).join("")}</tbody></table></div></div>`;
games.innerHTML=`<h2>Schedule</h2><div class=card><button onclick="addGame()">Add Game</button><div class=tablewrap><table><thead><tr><th>#</th><th>Date</th><th>Time</th><th>Court</th><th>Home</th><th>Away</th><th>Score</th><th>Status</th></tr></thead><tbody>${cache.games.map(g=>`<tr><td>${g.game_number||""}</td><td>${g.game_date||""}</td><td>${g.game_time||""}</td><td>${esc(g.court)}</td><td>${esc(g.home_team)}</td><td>${esc(g.away_team)}</td><td>${g.home_score??""} - ${g.away_score??""}</td><td>${esc(g.status)}</td></tr>`).join("")}</tbody></table></div></div>`;
const standings=calcStandings();document.getElementById("standings").innerHTML=`<h2>Standings</h2><div class=card><div class=tablewrap><table><thead><tr><th>Team</th><th>GP</th><th>W</th><th>L</th><th>PF</th><th>PA</th><th>PD</th><th>Pts</th></tr></thead><tbody>${standings.map(s=>`<tr><td>${esc(s.team)}</td><td>${s.gp}</td><td>${s.w}</td><td>${s.l}</td><td>${s.pf}</td><td>${s.pa}</td><td>${s.pd}</td><td>${s.points}</td></tr>`).join("")}</tbody></table></div></div>`;
payments.innerHTML=`<h2>Payments</h2><div class=card><button onclick="addPayment()">Add Payment</button><div class=tablewrap><table><thead><tr><th>Player</th><th>Team</th><th>Fee</th><th>Paid</th><th>Balance</th><th>Date</th><th>Method</th></tr></thead><tbody>${cache.payments.map(p=>`<tr><td>${esc(p.player)}</td><td>${esc(p.team)}</td><td>$${Number(p.fee||0).toFixed(2)}</td><td>$${Number(p.amount_paid||0).toFixed(2)}</td><td>$${(Number(p.fee||0)-Number(p.amount_paid||0)).toFixed(2)}</td><td>${p.date_paid||""}</td><td>${esc(p.method)}</td></tr>`).join("")}</tbody></table></div></div>`}
function calcStandings(){return cache.teams.map(t=>{let a={team:t.name,gp:0,w:0,l:0,pf:0,pa:0,points:0};cache.games.filter(g=>g.status==="Completed"&&(g.home_team===t.name||g.away_team===t.name)).forEach(g=>{let h=+g.home_score||0,v=+g.away_score||0;a.gp++;if(g.home_team===t.name){a.pf+=h;a.pa+=v;if(h>v)a.w++;else if(h<v)a.l++}else{a.pf+=v;a.pa+=h;if(v>h)a.w++;else if(v<h)a.l++}});a.pd=a.pf-a.pa;a.points=a.w*2;return a})}
async function addPlayer(){let first=prompt("First name");if(!first)return;let last=prompt("Last name")||"";let team=prompt("Team")||"";let division=prompt("Division")||"";let r=await client.from("players").insert({first_name:first,last_name:last,team,division,registration_fee:150,paid:0,waiver:"No"});if(r.error)alert(r.error.message);else await load()}
async function addTeam(){let name=prompt("Team name");if(!name)return;let division=prompt("Division")||"";let coach=prompt("Coach")||"";let r=await client.from("teams").insert({name,division,coach});if(r.error)alert(r.error.message);else await load()}
async function addGame(){let home=prompt("Home team")||"",away=prompt("Away team")||"",date=prompt("Date YYYY-MM-DD")||"";let r=await client.from("games").insert({game_number:cache.games.length+1,home_team:home,away_team:away,game_date:date,status:"Scheduled"});if(r.error)alert(r.error.message);else await load()}
async function addPayment(){let player=prompt("Player")||"",team=prompt("Team")||"",paid=Number(prompt("Amount paid","0")||0);let r=await client.from("payments").insert({player,team,fee:150,amount_paid:paid,date_paid:new Date().toISOString().slice(0,10)});if(r.error)alert(r.error.message);else await load()}
async function auth(){let {data:{session}}=await client.auth.getSession();if(session){login.style.display="none";app.style.display="block";user.textContent=session.user.email;logout.style.display="block";await load()}else{login.style.display="block";app.style.display="none"}}
signin.onclick=async()=>{authmsg.textContent="";let r=await client.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)authmsg.textContent=r.error.message;else auth()};
signup.onclick=async()=>{authmsg.textContent="";let r=await client.auth.signUp({email:email.value,password:password.value});if(r.error)authmsg.textContent=r.error.message;else authmsg.textContent="Account created. Check email if confirmation is enabled."};
logout.onclick=async()=>{await client.auth.signOut();auth()};
client.auth.onAuthStateChange(()=>auth());auth();
</script></body></html>
