<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse League Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--nav:#0f172a;--blue:#2563eb;--bg:#f4f7fb;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--danger:#dc2626;--green:#15803d;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial;background:var(--bg);color:var(--text)}
header{background:var(--nav);color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:24px}header .sub{color:#cbd5e1;margin-top:3px;font-size:14px}
#login{max-width:460px;margin:70px auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px rgba(15,23,42,.03)}
nav{display:flex;gap:5px;overflow:auto;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;position:sticky;top:76px;z-index:9}nav button{white-space:nowrap;background:transparent;color:#334155;border:0}nav button.active{background:#dbeafe;color:#1d4ed8}
main{max-width:1500px;margin:auto;padding:24px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.kpi{font-size:30px;font-weight:800;margin-top:5px}.muted{color:var(--muted);font-size:13px}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.titlebar h2{margin:0}
button{border:0;border-radius:8px;padding:9px 13px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}button:hover{filter:brightness(.96)}button.secondary{background:#e2e8f0;color:#0f172a}button.danger{background:var(--danger)}button.success{background:var(--green)}button.small{padding:6px 9px;font-size:12px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.toolbar input,.toolbar select{max-width:260px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.field textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px;vertical-align:middle}th{background:#f8fafc;position:sticky;top:0;z-index:1}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#e2e8f0}.badge.green{background:#dcfce7;color:#166534}.badge.blue{background:#dbeafe;color:#1d4ed8}.badge.amber{background:#fef3c7;color:#92400e}.badge.red{background:#fee2e2;color:#991b1b}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:30}.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;width:min(850px,100%);max-height:90vh;overflow:auto;padding:22px}.modalbox h3{margin-top:0}.error{color:#b91c1c;margin-top:8px}.successmsg{color:#15803d;margin-top:8px}.empty{padding:30px;text-align:center;color:var(--muted)}.statline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f7}.bracket{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.match{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.match .team{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef2f7}.notice{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:12px;border-radius:10px;margin-bottom:15px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:repeat(2,1fr)}.bracket{grid-template-columns:1fr}}
@media(max-width:600px){header{padding:15px}.grid,.row,.row2{grid-template-columns:1fr}main{padding:15px}nav{top:66px}}
</style>
</head>
<body>
<header><div><h1>Pulse League Manager</h1><div id="userSub" class="sub">Online</div></div><button id="logout" class="secondary" style="display:none">Sign out</button></header>
<div id="login"><div class="card"><h2>League Staff Login</h2><p class="muted">Sign in to access the shared league database.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><br><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div><br><button id="signin">Sign in</button><button id="signup" class="secondary" style="margin-left:8px">Create account</button><button id="forgot" class="secondary" style="margin-left:8px">Forgot password?</button><div id="authmsg" class="error"></div></div></div>
<div id="app" style="display:none"><nav id="nav"></nav><main>
<section id="dashboard" class="view active"></section><section id="players" class="view"></section><section id="teams" class="view"></section><section id="games" class="view"></section><section id="standings" class="view"></section><section id="payments" class="view"></section><section id="attendance" class="view"></section><section id="tournament" class="view"></section><section id="settings" class="view"></section>
</main></div>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script src="config.js"></script>
<script>
const client=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
const tabs=[['dashboard','Dashboard'],['players','Players'],['teams','Teams'],['games','Schedule'],['standings','Standings'],['payments','Payments'],['attendance','Attendance'],['tournament','Tournament'],['settings','Settings']];
const cache={players:[],teams:[],games:[],payments:[],attendance:[],bracket:[],settings:{}}; let activeTab='dashboard';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'$'+Number(n||0).toFixed(2); const today=()=>new Date().toISOString().slice(0,10);
async function getAll(table,order='created_at'){let r=await client.from(table).select('*').order(order,{ascending:true});if(r.error)throw r.error;return r.data||[]}
async function load(){try{[cache.players,cache.teams,cache.games,cache.payments,cache.attendance,cache.bracket]=await Promise.all([getAll('players'),getAll('teams'),getAll('games','game_date'),getAll('payments'),getAll('attendance'),getAll('bracket_matches','sort_order')]);let s=await client.from('league_settings').select('*');if(s.error)throw s.error;cache.settings={};(s.data||[]).forEach(x=>cache.settings[x.key]=x.value);renderAll()}catch(e){console.error(e);alert('Could not load league data: '+e.message)}}
function renderNav(){const n=$('nav');n.innerHTML=tabs.map(x=>`<button class="${activeTab===x[0]?'active':''}" onclick="showTab('${x[0]}')">${x[1]}</button>`).join('')}
function showTab(id){activeTab=id;document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');renderNav()}
function renderAll(){renderNav();renderDashboard();renderPlayers();renderTeams();renderGames();renderStandings();renderPayments();renderAttendance();renderTournament();renderSettings();showTab(activeTab)}
function renderDashboard(){const collected=cache.payments.reduce((a,x)=>a+Number(x.amount_paid||0),0), outstanding=cache.players.reduce((a,x)=>a+Math.max(0,Number(x.registration_fee||0)-Number(x.paid||0)),0);const upcoming=cache.games.filter(g=>g.game_date&&g.game_date>=today()).slice(0,6);$('dashboard').innerHTML=`<div class="titlebar"><h2>Dashboard</h2><button onclick="load()">Refresh</button></div><div class="grid"><div class="card"><div class="muted">Players</div><div class="kpi">${cache.players.length}</div></div><div class="card"><div class="muted">Teams</div><div class="kpi">${cache.teams.length}</div></div><div class="card"><div class="muted">Games</div><div class="kpi">${cache.games.length}</div></div><div class="card"><div class="muted">Collected</div><div class="kpi">${money(collected)}</div></div></div><div class="grid"><div class="card"><div class="muted">Outstanding player balances</div><div class="kpi">${money(outstanding)}</div></div><div class="card"><div class="muted">Completed games</div><div class="kpi">${cache.games.filter(g=>g.status==='Completed').length}</div></div><div class="card"><div class="muted">Scheduled games</div><div class="kpi">${cache.games.filter(g=>g.status==='Scheduled').length}</div></div><div class="card"><div class="muted">Tournament matches</div><div class="kpi">${cache.bracket.length}</div></div></div><div class="card"><div class="titlebar"><h3>Upcoming games</h3><button class="secondary" onclick="showTab('games')">Open schedule</button></div>${upcoming.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Time</th><th>Court</th><th>Home</th><th>Away</th><th>Status</th></tr></thead><tbody>${upcoming.map(g=>`<tr><td>${esc(g.game_date)}</td><td>${esc(g.game_time)}</td><td>${esc(g.court)}</td><td>${esc(g.home_team)}</td><td>${esc(g.away_team)}</td><td>${statusBadge(g.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No upcoming games.</div>'}</div>`}
function statusBadge(s){const c=s==='Completed'?'green':s==='Cancelled'?'red':s==='Scheduled'?'blue':'amber';return `<span class="badge ${c}">${esc(s||'Scheduled')}</span>`}
function renderPlayers(){const term=esc(($('playerSearch')?.value||''));const rows=cache.players.filter(p=>(`${p.first_name||''} ${p.last_name||''} ${p.team||''} ${p.division||''}`).toLowerCase().includes(term.toLowerCase()));$('players').innerHTML=`<div class="titlebar"><h2>Players</h2><button onclick="openPlayer()">+ Add Player</button></div><div class="card"><div class="toolbar"><input id="playerSearch" placeholder="Search players, teams or divisions" value="${term}" oninput="renderPlayers()"><button class="secondary" onclick="exportTable('players')">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Player</th><th>Division</th><th>Team</th><th>Jersey</th><th>Phone</th><th>Fee</th><th>Paid</th><th>Balance</th><th></th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr><td>${esc(p.first_name)} ${esc(p.last_name)}</td><td>${esc(p.division)}</td><td>${esc(p.team)}</td><td>${esc(p.jersey)}</td><td>${esc(p.phone)}</td><td>${money(p.registration_fee)}</td><td>${money(p.paid)}</td><td>${money(Math.max(0,Number(p.registration_fee||0)-Number(p.paid||0)))}</td><td><button class="small secondary" onclick="openPlayer('${p.id}')">Edit</button> <button class="small danger" onclick="removeRow('players','${p.id}')">Delete</button></td></tr>`).join(''):'<tr><td colspan="9" class="empty">No players yet.</td></tr>'}</tbody></table></div></div>`}
function renderTeams(){ $('teams').innerHTML=`<div class="titlebar"><h2>Teams</h2><button onclick="openTeam()">+ Add Team</button></div><div class="card"><div class="toolbar"><input id="teamSearch" placeholder="Search teams" oninput="renderTeams()"><button class="secondary" onclick="exportTable('teams')">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Team</th><th>Division</th><th>Coach</th><th>Phone</th><th>Email</th><th>Roster</th><th></th></tr></thead><tbody>${cache.teams.filter(t=>(`${t.name} ${t.division} ${t.coach}`).toLowerCase().includes(($('teamSearch')?.value||'').toLowerCase())).map(t=>`<tr><td>${esc(t.name)}</td><td>${esc(t.division)}</td><td>${esc(t.coach)}</td><td>${esc(t.phone)}</td><td>${esc(t.email)}</td><td>${cache.players.filter(p=>p.team===t.name).length}</td><td><button class="small secondary" onclick="openTeam('${t.id}')">Edit</button> <button class="small danger" onclick="removeRow('teams','${t.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No teams found.</td></tr>'}</tbody></table></div></div>`}
function renderGames(){ $('games').innerHTML=`<div class="titlebar"><h2>Schedule</h2><button onclick="openGame()">+ Add Game</button></div><div class="card"><div class="toolbar"><select id="gameStatusFilter" onchange="renderGames()"><option value="">All statuses</option><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select><input id="gameSearch" placeholder="Search team/court/date" oninput="renderGames()"><button class="secondary" onclick="exportTable('games')">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>#</th><th>Date</th><th>Time</th><th>Court</th><th>Home</th><th>Away</th><th>Score</th><th>Status</th><th></th></tr></thead><tbody>${cache.games.filter(g=>(!($('gameStatusFilter')?.value)||g.status===$('gameStatusFilter').value)&&(`${g.game_number||''} ${g.game_date||''} ${g.court||''} ${g.home_team||''} ${g.away_team||''}`).toLowerCase().includes(($('gameSearch')?.value||'').toLowerCase())).map(g=>`<tr><td>${esc(g.game_number)}</td><td>${esc(g.game_date)}</td><td>${esc(g.game_time)}</td><td>${esc(g.court)}</td><td>${esc(g.home_team)}</td><td>${esc(g.away_team)}</td><td>${g.home_score??''} - ${g.away_score??''}</td><td>${statusBadge(g.status)}</td><td><button class="small secondary" onclick="openGame('${g.id}')">Edit</button> <button class="small danger" onclick="removeRow('games','${g.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No games found.</td></tr>'}</tbody></table></div></div>`}
function calcStandings(){return cache.teams.map(t=>{let a={team:t.name,gp:0,w:0,l:0,t:0,pf:0,pa:0,points:0};cache.games.filter(g=>g.status==='Completed'&&(g.home_team===t.name||g.away_team===t.name)).forEach(g=>{let h=Number(g.home_score),v=Number(g.away_score);if(Number.isNaN(h)||Number.isNaN(v))return;a.gp++;if(g.home_team===t.name){a.pf+=h;a.pa+=v;if(h>v)a.w++;else if(h<v)a.l++;else a.t++}else{a.pf+=v;a.pa+=h;if(v>h)a.w++;else if(v<h)a.l++;else a.t++}});a.pd=a.pf-a.pa;a.points=a.w*2+a.t;return a}).sort((a,b)=>b.points-a.points||b.pd-a.pd||b.pf-a.pf)}
function renderStandings(){const rows=calcStandings();$('standings').innerHTML=`<div class="titlebar"><h2>Standings</h2><button class="secondary" onclick="exportTable('standings')">Export CSV</button></div><div class="card"><div class="notice">Standings update automatically from games marked <b>Completed</b>. Points: 2 for a win, 1 for a tie.</div><div class="tablewrap"><table><thead><tr><th>#</th><th>Team</th><th>GP</th><th>W</th><th>L</th><th>T</th><th>PF</th><th>PA</th><th>PD</th><th>Pts</th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.team)}</td><td>${s.gp}</td><td>${s.w}</td><td>${s.l}</td><td>${s.t}</td><td>${s.pf}</td><td>${s.pa}</td><td>${s.pd}</td><td><b>${s.points}</b></td></tr>`).join('')||'<tr><td colspan="10" class="empty">No teams yet.</td></tr>'}</tbody></table></div></div>`}
function renderPayments(){const total=cache.payments.reduce((a,p)=>a+Number(p.amount_paid||0),0);$('payments').innerHTML=`<div class="titlebar"><h2>Payments</h2><button onclick="openPayment()">+ Add Payment</button></div><div class="grid"><div class="card"><div class="muted">Collected</div><div class="kpi">${money(total)}</div></div><div class="card"><div class="muted">Transactions</div><div class="kpi">${cache.payments.length}</div></div></div><div class="card"><div class="toolbar"><button class="secondary" onclick="exportTable('payments')">Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Player</th><th>Team</th><th>Fee</th><th>Paid</th><th>Balance</th><th>Date</th><th>Method</th><th>Reference</th><th></th></tr></thead><tbody>${cache.payments.map(p=>`<tr><td>${esc(p.player)}</td><td>${esc(p.team)}</td><td>${money(p.fee)}</td><td>${money(p.amount_paid)}</td><td>${money(Number(p.fee||0)-Number(p.amount_paid||0))}</td><td>${esc(p.date_paid)}</td><td>${esc(p.method)}</td><td>${esc(p.reference)}</td><td><button class="small danger" onclick="removeRow('payments','${p.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No payments yet.</td></tr>'}</tbody></table></div></div>`}
function renderAttendance(){const games=cache.games.slice().sort((a,b)=>String(a.game_date||'').localeCompare(String(b.game_date||'')));$('attendance').innerHTML=`<div class="titlebar"><h2>Attendance</h2><button onclick="openAttendance()">+ Record Attendance</button></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Game #</th><th>Date</th><th>Player</th><th>Team</th><th>Present</th><th>Notes</th><th></th></tr></thead><tbody>${cache.attendance.map(a=>`<tr><td>${esc(a.game_number)}</td><td>${esc((games.find(g=>g.game_number===a.game_number)||{}).game_date)}</td><td>${esc(a.player)}</td><td>${esc(a.team)}</td><td>${esc(a.present)}</td><td>${esc(a.notes)}</td><td><button class="small danger" onclick="removeRow('attendance','${a.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No attendance records yet.</td></tr>'}</tbody></table></div></div>`}
function renderTournament(){const bs=cache.bracket.slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));$('tournament').innerHTML=`<div class="titlebar"><h2>Tournament</h2><button onclick="openBracket()">+ Add Match</button></div><div class="bracket">${bs.map(m=>`<div class="match"><b>${esc(m.match_name)}</b><div class="team"><span>${esc(m.team_a||'TBD')}</span><strong>${m.score_a??''}</strong></div><div class="team"><span>${esc(m.team_b||'TBD')}</span><strong>${m.score_b??''}</strong></div><div style="margin-top:9px">Winner: <b>${esc(m.winner||'TBD')}</b></div><div style="margin-top:10px"><button class="small secondary" onclick="openBracket('${m.id}')">Edit</button> <button class="small danger" onclick="removeRow('bracket_matches','${m.id}')">Delete</button></div></div>`).join('')||'<div class="card empty">No tournament matches yet.</div>'}</div>`}
function renderSettings(){const s=cache.settings;const divisions=Array.isArray(s.divisions)?s.divisions:[];const courts=Array.isArray(s.courts)?s.courts:[];$('settings').innerHTML=`<div class="titlebar"><h2>Settings</h2></div><div class="card"><h3>Account</h3><p class="muted">Signed in as ${esc(currentUser?.email||'')}</p><button onclick="changePassword()">Change Password</button><button class="secondary" style="margin-left:8px" onclick="sendReset()">Send Password Reset Email</button></div><div class="card"><h3>League configuration</h3><div class="row2"><div class="field"><label>Divisions (one per line)</label><textarea id="setDivisions">${esc(divisions.join('\n'))}</textarea></div><div class="field"><label>Courts (one per line)</label><textarea id="setCourts">${esc(courts.join('\n'))}</textarea></div></div><div class="actions"><button onclick="saveSettings()">Save Settings</button></div><div id="setmsg"></div></div>`}
function modal(html){$('modalbox').innerHTML=html;$('modal').classList.add('open')};function closeModal(){$('modal').classList.remove('open')};$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};
function teamOptions(selected=''){return '<option value="">— Select —</option>'+cache.teams.map(t=>`<option ${t.name===selected?'selected':''}>${esc(t.name)}</option>`).join('')}
function playerOptions(selected=''){return '<option value="">— Select —</option>'+cache.players.map(p=>{let n=`${p.first_name||''} ${p.last_name||''}`.trim();return `<option value="${esc(n)}" data-team="${esc(p.team||'') }" ${n===selected?'selected':''}>${esc(n)}</option>`}).join('')}
function openPlayer(id){const p=cache.players.find(x=>x.id===id)||{};modal(`<h3>${id?'Edit':'Add'} Player</h3><form onsubmit="savePlayer(event,'${id||''}')"><div class="row"><div class="field"><label>First name</label><input name="first_name" required value="${esc(p.first_name)}"></div><div class="field"><label>Last name</label><input name="last_name" value="${esc(p.last_name)}"></div><div class="field"><label>Division</label><input name="division" value="${esc(p.division)}"></div><div class="field"><label>Team</label><select name="team">${teamOptions(p.team)}</select></div></div><br><div class="row"><div class="field"><label>Jersey</label><input name="jersey" value="${esc(p.jersey)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(p.phone)}"></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(p.email)}"></div><div class="field"><label>Registration fee</label><input name="registration_fee" type="number" step="0.01" value="${Number(p.registration_fee||150)}"></div></div><br><div class="row"><div class="field"><label>Paid</label><input name="paid" type="number" step="0.01" value="${Number(p.paid||0)}"></div><div class="field"><label>Payment method</label><input name="payment_method" value="${esc(p.payment_method)}"></div><div class="field"><label>Waiver</label><select name="waiver"><option ${p.waiver==='Yes'?'selected':''}>Yes</option><option ${p.waiver!=='Yes'?'selected':''}>No</option></select></div><div class="field"><label>Emergency contact</label><input name="emergency_contact" value="${esc(p.emergency_contact)}"></div></div><br><div class="field"><label>Notes</label><textarea name="notes">${esc(p.notes)}</textarea></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save Player</button></div></form>`)}
async function savePlayer(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e).entries());['registration_fee','paid'].forEach(k=>o[k]=Number(o[k]||0));let r=id?await client.from('players').update(o).eq('id',id):await client.from('players').insert(o);if(r.error)return alert(r.error.message);closeModal();await load()}
function openTeam(id){const t=cache.teams.find(x=>x.id===id)||{};modal(`<h3>${id?'Edit':'Add'} Team</h3><form onsubmit="saveTeam(event,'${id||''}')"><div class="row"><div class="field"><label>Team name</label><input name="name" required value="${esc(t.name)}"></div><div class="field"><label>Division</label><input name="division" value="${esc(t.division)}"></div><div class="field"><label>Coach</label><input name="coach" value="${esc(t.coach)}"></div><div class="field"><label>Phone</label><input name="phone" value="${esc(t.phone)}"></div></div><br><div class="row2"><div class="field"><label>Email</label><input name="email" type="email" value="${esc(t.email)}"></div><div class="field"><label>Notes</label><input name="notes" value="${esc(t.notes)}"></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save Team</button></div></form>`)}
async function saveTeam(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e).entries());let r=id?await client.from('teams').update(o).eq('id',id):await client.from('teams').insert(o);if(r.error)return alert(r.error.message);closeModal();await load()}
function openGame(id){const g=cache.games.find(x=>x.id===id)||{};modal(`<h3>${id?'Edit':'Add'} Game</h3><form onsubmit="saveGame(event,'${id||''}')"><div class="row"><div class="field"><label>Game #</label><input name="game_number" type="number" value="${esc(g.game_number??(cache.games.length+1))}"></div><div class="field"><label>Division</label><input name="division" value="${esc(g.division)}"></div><div class="field"><label>Date</label><input name="game_date" type="date" value="${esc(g.game_date)}"></div><div class="field"><label>Time</label><input name="game_time" type="time" value="${esc(g.game_time)}"></div></div><br><div class="row"><div class="field"><label>Court</label><input name="court" value="${esc(g.court)}"></div><div class="field"><label>Home team</label><select name="home_team">${teamOptions(g.home_team)}</select></div><div class="field"><label>Away team</label><select name="away_team">${teamOptions(g.away_team)}</select></div><div class="field"><label>Status</label><select name="status"><option ${g.status==='Scheduled'?'selected':''}>Scheduled</option><option ${g.status==='Completed'?'selected':''}>Completed</option><option ${g.status==='Cancelled'?'selected':''}>Cancelled</option></select></div></div><br><div class="row2"><div class="field"><label>Home score</label><input name="home_score" type="number" min="0" value="${esc(g.home_score??'')}"></div><div class="field"><label>Away score</label><input name="away_score" type="number" min="0" value="${esc(g.away_score??'')}"></div></div><br><div class="field"><label>Notes</label><textarea name="notes">${esc(g.notes)}</textarea></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save Game</button></div></form>`)}
async function saveGame(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e).entries());['game_number','home_score','away_score'].forEach(k=>o[k]=o[k]===''?null:Number(o[k]));let r=id?await client.from('games').update(o).eq('id',id):await client.from('games').insert(o);if(r.error)return alert(r.error.message);closeModal();await load()}
function openPayment(){modal(`<h3>Add Payment</h3><form onsubmit="savePayment(event)"><div class="row"><div class="field"><label>Player</label><select name="player" onchange="syncPaymentTeam(this)">${playerOptions()}</select></div><div class="field"><label>Team</label><input name="team" id="paymentTeam"></div><div class="field"><label>Fee</label><input name="fee" type="number" step="0.01" value="150"></div><div class="field"><label>Amount paid</label><input name="amount_paid" type="number" step="0.01" required></div></div><br><div class="row"><div class="field"><label>Date</label><input name="date_paid" type="date" value="${today()}"></div><div class="field"><label>Method</label><input name="method" placeholder="Cash, e-transfer, etc."></div><div class="field"><label>Reference</label><input name="reference"></div><div class="field"><label>Notes</label><input name="notes"></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save Payment</button></div></form>`)}
function syncPaymentTeam(sel){const opt=sel.options[sel.selectedIndex];$('paymentTeam').value=opt?.dataset?.team||''}
async function savePayment(e){e.preventDefault();const o=Object.fromEntries(new FormData(e).entries());o.fee=Number(o.fee||0);o.amount_paid=Number(o.amount_paid||0);let r=await client.from('payments').insert(o);if(r.error)return alert(r.error.message);if(o.player){const p=cache.players.find(x=>`${x.first_name||''} ${x.last_name||''}`.trim()===o.player);if(p)await client.from('players').update({paid:Number(p.paid||0)+o.amount_paid}).eq('id',p.id)}closeModal();await load()}
function openAttendance(){modal(`<h3>Record Attendance</h3><form onsubmit="saveAttendance(event)"><div class="row"><div class="field"><label>Game</label><select name="game_number" required>${cache.games.map(g=>`<option value="${esc(g.game_number)}">#${esc(g.game_number)} — ${esc(g.game_date)} — ${esc(g.home_team)} vs ${esc(g.away_team)}</option>`).join('')}</select></div><div class="field"><label>Player</label><select name="player_id" id="attPlayer" onchange="syncAttendancePlayer(this)" required>${cache.players.map(p=>`<option value="${esc(p.id)}" data-name="${esc(`${p.first_name||''} ${p.last_name||''}`.trim())}" data-team="${esc(p.team||'')}">${esc(`${p.first_name||''} ${p.last_name||''}`.trim())}</option>`).join('')}</select></div><div class="field"><label>Present</label><select name="present"><option>Yes</option><option>No</option><option>Late</option></select></div><div class="field"><label>Team</label><input name="team" id="attTeam" readonly></div></div><br><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><input type="hidden" name="player" id="attPlayerName"><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save Attendance</button></div></form>`);$('attPlayer')?.dispatchEvent(new Event('change'))}
function syncAttendancePlayer(sel){const o=sel.options[sel.selectedIndex];$('attTeam').value=o?.dataset?.team||'';$('attPlayerName').value=o?.dataset?.name||''}
async function saveAttendance(e){e.preventDefault();const o=Object.fromEntries(new FormData(e).entries());delete o.player_id;let r=await client.from('attendance').insert(o);if(r.error)return alert(r.error.message);closeModal();await load()}
function openBracket(id){const b=cache.bracket.find(x=>x.id===id)||{};modal(`<h3>${id?'Edit':'Add'} Tournament Match</h3><form onsubmit="saveBracket(event,'${id||''}')"><div class="row"><div class="field"><label>Match name</label><input name="match_name" required value="${esc(b.match_name)}"></div><div class="field"><label>Team A</label><input name="team_a" value="${esc(b.team_a)}"></div><div class="field"><label>Score A</label><input name="score_a" type="number" min="0" value="${esc(b.score_a??'')}"></div><div class="field"><label>Sort order</label><input name="sort_order" type="number" value="${esc(b.sort_order??0)}"></div></div><br><div class="row"><div class="field"><label>Team B</label><input name="team_b" value="${esc(b.team_b)}"></div><div class="field"><label>Score B</label><input name="score_b" type="number" min="0" value="${esc(b.score_b??'')}"></div><div class="field"><label>Winner</label><input name="winner" value="${esc(b.winner)}"></div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save Match</button></div></form>`)}
async function saveBracket(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e).entries());['score_a','score_b','sort_order'].forEach(k=>o[k]=o[k]===''?null:Number(o[k]));let r=id?await client.from('bracket_matches').update(o).eq('id',id):await client.from('bracket_matches').insert(o);if(r.error)return alert(r.error.message);closeModal();await load()}
async function removeRow(table,id){if(!confirm('Delete this record?'))return;let r=await client.from(table).delete().eq('id',id);if(r.error)alert(r.error.message);else await load()}
async function saveSettings(){const divisions=$('setDivisions').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean),courts=$('setCourts').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);for(const [key,value] of [['divisions',divisions],['courts',courts]]){let r=await client.from('league_settings').upsert({key,value},{onConflict:'key'});if(r.error)return alert(r.error.message)}$('setmsg').innerHTML='<div class="successmsg">Settings saved.</div>';await load()}
async function changePassword(){const p=prompt('Enter your new password (minimum 8 characters):');if(!p)return;if(p.length<8)return alert('Password must be at least 8 characters.');let r=await client.auth.updateUser({password:p});if(r.error)alert(r.error.message);else alert('Password changed successfully.')}
async function sendReset(){const r=await client.auth.resetPasswordForEmail(currentUser.email,{redirectTo:location.origin});if(r.error)alert(r.error.message);else alert('Password reset email sent to '+currentUser.email)}
function exportTable(type){let data=[];if(type==='players')data=cache.players;else if(type==='teams')data=cache.teams;else if(type==='games')data=cache.games;else if(type==='payments')data=cache.payments;else if(type==='standings')data=calcStandings();if(!data.length)return alert('Nothing to export.');const cols=Object.keys(data[0]);const csv=[cols.join(','),...data.map(r=>cols.map(c=>`"${String(r[c]??'').replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`pulse-${type}.csv`;a.click();URL.revokeObjectURL(a.href)}
let currentUser=null;
async function auth(){const {data:{session}}=await client.auth.getSession();if(session){currentUser=session.user;$('login').style.display='none';$('app').style.display='block';$('userSub').textContent=session.user.email;$('logout').style.display='block';await load()}else{currentUser=null;$('login').style.display='block';$('app').style.display='none';$('userSub').textContent='Online';$('logout').style.display='none'}}
$('signin').onclick=async()=>{ $('authmsg').textContent='';let r=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('authmsg').textContent=r.error.message;else auth()};
$('signup').onclick=async()=>{ $('authmsg').textContent='';let r=await client.auth.signUp({email:$('email').value,password:$('password').value});if(r.error)$('authmsg').textContent=r.error.message;else $('authmsg').innerHTML='<span class="successmsg">Account created. Check your email if confirmation is enabled.</span>'};
$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e)return $('authmsg').textContent='Enter your email first.';let r=await client.auth.resetPasswordForEmail(e,{redirectTo:location.origin});if(r.error)$('authmsg').textContent=r.error.message;else $('authmsg').innerHTML='<span class="successmsg">Password reset email sent.</span>'};
$('logout').onclick=async()=>{await client.auth.signOut();auth()};
client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'||event==='SIGNED_IN')setTimeout(auth,0)});auth();
</script></body></html>
